spring.application.name=ai-exam-platform
server.port=8080

# JWT Configuration
jwt.secret=exam-platform-jwt-secret-key-for-production-use-change-in-production
jwt.expiration=86400000

# Database Configuration
spring.datasource.url=jdbc:h2:file:./data/examdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Logging
logging.level.com.examplatform=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# LLM API (optional - for AI feedback)
llm.api.url=
llm.api.key=
